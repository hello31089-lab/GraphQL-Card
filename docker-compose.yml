services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graphql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphql"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/graphql?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
